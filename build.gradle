plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devkor.ifive'
version = '0.0.1-SNAPSHOT'
description = 'Spring Boot backend server for Nadab project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
    set('testcontainersVersion', "2.0.3")
    set('springAiVersion', "1.1.2")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13"

    // Flyway
    implementation 'org.flywaydb:flyway-core:11.7.1'
    implementation 'org.flywaydb:flyway-database-postgresql:11.7.1'

    // JWT
    implementation 'com.auth0:java-jwt:4.5.0'

    // WebClient (OAuth2 직접 구현용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.39.4')
    implementation 'software.amazon.awssdk:s3'

    // AWS KMS
    implementation 'software.amazon.awssdk:kms'

    // AWS CloudFront
    implementation 'software.amazon.awssdk:cloudfront'

    // BadWordFiltering 라이브러리
    implementation 'io.github.vaneproject:badwordfiltering:1.0.0'
    implementation 'com.modernmt.text:profanity-filter:1.0.1'

    // Spring Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Spring AI - OpenAI
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // testcontainers
    testImplementation 'org.testcontainers:postgresql'
    testImplementation "org.testcontainers:junit-jupiter"

    // Anthropic (Claude)
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // Gemini
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    // Hypersistence Utils
    implementation "io.hypersistence:hypersistence-utils-hibernate-63:3.7.6"

    // Thymeleaf (통계 페이지용)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.7.1'

    // openhtmltopdf
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.40'

    // webp 디코더
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
	useJUnitPlatform {
		// 렌더 실측 하네스는 무겁고 큰 힙이 필요 → 일반 test/build 에서 제외, pdfBench 로만 실행
		excludeTags 'bench'
	}
}

// PDF 렌더 실측 하네스: ./gradlew pdfBench (사진: -Dpdf.bench.photoDir=<webp 디렉터리>, 규모: -Dpdf.bench.days/photoRatio).
tasks.register('pdfBench', Test) {
	group = 'verification'
	description = 'PDF 렌더 실측 하네스(peak heap · 시간 · CPU). @Tag("bench") 만 실행.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'bench'
	}
	// 기본 2g(peak 관측용). 힙 요구량 탐색 시 -PbenchXmx=512m 등으로 낮춤.
	maxHeapSize = project.findProperty('benchXmx') ?: '2g'
	// t3.small(2 vCPU) 경합 재현: -PbenchCpu=2 → JVM 이 가용 코어를 2로 인식(라이트 CPU 스로틀 근사, 코어당 속도는 여전히 dev급)
	if (project.hasProperty('benchCpu')) {
		jvmArgs "-XX:ActiveProcessorCount=${project.property('benchCpu')}"
	}
	// 원인 규명 프로파일링(옵션):
	//  -PbenchJfr   → JFR allocation 프로파일(build/pdf-render.jfr). 분석: jfr print --events jdk.ObjectAllocationSample --stack-depth 30 build/pdf-render.jfr
	//  -PbenchGcLog → GC 로그(build/pdf-gc.log). GC 후 live(=floor) vs GC 사이 할당(=churn) 분리용.
	if (project.hasProperty('benchJfr')) {
		// %p=PID → JVM 마다 별도 파일(여러 워커가 같은 파일 덮어쓰는 것 방지). 벤치 워커 = 가장 큰 파일.
		jvmArgs "-XX:StartFlightRecording=settings=profile,filename=${project.buildDir}/pdf-render-%p.jfr,dumponexit=true"
	}
	if (project.hasProperty('benchGcLog')) {
		jvmArgs "-Xlog:gc*,gc+heap=debug:file=${project.buildDir}/pdf-gc.log:time,level,tags"
	}
	forkEvery = 1
	maxParallelForks = 1
	// pdf.bench.* 시스템 프로퍼티를 포크 JVM 으로 전달
	systemProperties = System.properties.findAll { it.key.toString().startsWith('pdf.bench.') }
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
	outputs.upToDateWhen { false }
}
