spring:
  application:
    name: nadab

  config:
    import:
      - classpath:config/reserved-nicknames.yml

  profiles:
    active: local

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.0
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-3-haiku-20240307
          temperature: 0.2
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2

springdoc:
  api-docs:
    enabled: false   # 공통: 기본 꺼두기
  swagger-ui:
    path: /swagger-ui.html

token:
  jwt-secret: ${JWT_SECRET}
  access-token-expiration: 3600000  # 1시간 (밀리초)
  refresh-token-expiration: 1209600000  # 14일 (밀리초)

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${IAM_ACCESS_KEY}
      secret-key: ${IAM_SECRET_KEY}
    s3:
      bucket: ${BUCKET_NAME}
    kms:
      key-id: ${KMS_KEY_ID}

app:
  cookie:
    secure: false
    same-site: Lax

admin:
  page:
    password: ${ADMIN_PAGE_PASSWORD}
    token-expiration-seconds: 43200
    cookie-name: admin_auth

api_prefix: /api/v1

daily-report:
  llm:
    candidates:
      - model: gpt-4o-mini
        weight: 50
        temperature: 0.3
        max-output-tokens: 512
        token-limit-parameter: MAX_TOKENS
      - model: gpt-5.6-luna
        weight: 50
        temperature: 1.0
        max-output-tokens: 512
        token-limit-parameter: MAX_COMPLETION_TOKENS
        reasoning-effort: none

ask-chat:
  answer:
    provider: OPENAI
    model: gpt-5.6-luna
    temperature: 1.0
    max-tokens: 900
    recent-message-limit: 10
    follow-up-question-count: 2
    prompt-version: 2
  rag:
    embedding-model: text-embedding-3-small
    embedding-dimensions: 1536
    embedding-version: 1
    embedding-batch-size: 20
    backfill-batch-size: 20
    retrieval-limit: 5
    embedding-retry-enabled: true
    embedding-retry-fixed-delay-ms: 60000
    embedding-max-retry-count: 3

firebase:
  admin:
    key-base64: ${FIREBASE_ADMIN_KEY}

openai:
  api-key: ${OPENAI_API_KEY}
  image:
    model: gpt-image-1.5
    size: 1024x1024
    quality: low
    output-format: webp
